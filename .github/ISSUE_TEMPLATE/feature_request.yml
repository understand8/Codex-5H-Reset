name: Feature Request / 功能建议
description: 为 Codex-5H-Reset 提出新功能或交互优化建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 Codex-5H-Reset 出谋划策！欢迎提出任何能够改善 AI CLI 额度体验的想法。
  - type: textarea
    id: problem
    attributes:
      label: 目标场景或现有痛点
      description: 遇到了什么不便？或者为什么需要这个新功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望软件如何实现这一功能？有怎样的交互逻辑？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其它备选方案或参考
      description: 是否有其他软件或 CLI 实现了类似效果？
